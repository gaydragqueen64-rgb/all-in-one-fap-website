<div class="container">
  <h1 class="bounce">NitroIDE 🚀</h1>
  <p class="bounce">Type div>ul>li*3 and hit Tab to test Emmet!</p>
<div class="fap-instructor">
  <h2>Fap Instructor</h2>
  <div id="beat-counter">Beat: 0</div>
  <div id="progress-container"><div id="progress-bar"></div></div>
<div id="beat-indicator"></div>
  <label for="bpm-input">BPM:</label>
  <input type="number" id="bpm-input" value="120" min="30" max="300">
  <label for="duration-input">Duration (min):</label>
  <input type="number" id="duration-input" value="0" min="0">
  <label for="volume-input">Volume:</label>
  <input type="range" id="volume-input" min="0" max="1" step="0.01" value="0.5">
  <button id="start-stop-btn">Start</button>
  <button id="reset-btn">Reset</button>
  <button id="edge-mode-btn">Edge Mode: Off</button>
  <button id="theme-toggle-btn">Toggle Theme</button>
<button id="max-mode-btn">Max Mode: Off</button>
</div>
</div>
